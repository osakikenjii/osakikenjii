<svg xmlns="http://www.w3.org/2000/svg" width="800" height="656" viewBox="0 0 800 656" role="img" aria-labelledby="t d">
<title id="t">Stack de segurança e infraestrutura</title><desc id="d">firewall: Fortinet FortiGate, SonicWall, NGFW/UTM, regras LAN/WAN, NAT, segmentação por VLAN. inspeção: DPI, inspeção de pacotes, inspeção SSL/TLS, IPS/IDS, controle de aplicações, filtragem de conteúdo web. vpn e links: VPN SSL, VPN IPsec, failover de links, load balancing. incidentes: análise de incidentes, análise de logs, triagem N1/N2, troubleshooting, RCA (causa raiz). protocolos: TCP/IP, UDP, TLS/SSL, IPsec, DNS, DHCP, 802.1Q. cloud: Microsoft Azure, Entra ID, Intune, Exchange Online, SharePoint, Microsoft 365, Security and Compliance, Windows Server. redes: Ubiquiti UniFi, MikroTik, Cisco, VLANs, cabeamento estruturado. suporte: N1 e N2, suporte residente VIP, gestão de chamados, SLAs, PJe e e-SAJ, certificação digital.</desc>
