<title id="t">Stack</title><desc id="d">netsec: Fortinet FortiGate, SonicWall, NGFW/UTM, DPI, inspeção de pacotes, IPS/IDS, inspeção SSL/TLS, filtragem de conteúdo, VPN SSL/IPsec, failover e load balancing, análise de incidentes. cloud: Microsoft Azure, Entra ID, Intune, Exchange Online, SharePoint, Microsoft 365, Windows Server. redes: Ubiquiti UniFi, MikroTik, Cisco, VLANs, DHCP, DNS, NAT. suporte: N1 e N2, suporte residente VIP, gestão de chamados, SLAs, certificação digital. dev freelance: HTML5, CSS3, JavaScript, Bootstrap, Java, C#, Spring, MySQL, Eclipse.</desc>
